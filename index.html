<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Aggregator</title>
  <meta name="description" content="A modern news aggregator that collects articles from multiple sources">
  <script type="module" crossorigin src="./assets/main-DxPMV3jA.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-BqYkKRRr.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-content">
        <h1 class="header-title">
          <span class="header-icon">📰</span>
          News Aggregator
        </h1>
        <div class="header-actions">
          <button id="refresh-btn" class="btn btn-primary" aria-label="Refresh news">
            <span class="btn-icon">🔄</span>
            <span class="btn-text">Refresh</span>
          </button>
          <button id="mobile-filter-toggle" class="btn btn-icon-only" aria-label="Toggle filters" hidden>
            <span>⚙️</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar" role="complementary" aria-label="News filters">
        <div class="sidebar-header">
          <h2>Filters</h2>
          <button id="close-sidebar" class="btn btn-icon-only" aria-label="Close filters" hidden>
            <span>✕</span>
          </button>
        </div>
        
        <div class="filter-section">
          <h3 class="filter-title">Sources</h3>
          <div id="source-filters" class="filter-options" role="group" aria-label="Filter by source">
            <!-- Source checkboxes will be injected here -->
          </div>
        </div>

        <div class="filter-section">
          <h3 class="filter-title">Date Range</h3>
          <select id="date-range" class="select-input" aria-label="Select date range">
            <option value="all">All Time</option>
            <option value="today">Today</option>
            <option value="thisweek">This Week</option>
            <option value="thismonth">This Month</option>
          </select>
        </div>

        <div class="filter-section">
          <h3 class="filter-title">Sort By</h3>
          <select id="sort-order" class="select-input" aria-label="Sort order">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </aside>

      <!-- Overlay for mobile sidebar -->
      <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

      <!-- Main Content -->
      <main class="content" role="main">
        <div class="content-header">
          <span id="article-count" class="article-count">Loading...</span>
        </div>
        
        <div id="news-grid" class="news-grid" role="feed" aria-label="News articles">
          <!-- News cards will be injected here -->
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="loading-state" hidden>
          <div class="skeleton-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="error-state" hidden>
          <div class="error-icon">⚠️</div>
          <h3>Failed to load news</h3>
          <p id="error-message">Something went wrong. Please try again.</p>
          <button id="retry-btn" class="btn btn-primary">Retry</button>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon">📭</div>
          <h3>No articles found</h3>
          <p>Try adjusting your filters to see more results.</p>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <p>News Aggregator &copy; 2026. News sources belong to their respective owners.</p>
    </footer>
  </div>

</body>
</html>
